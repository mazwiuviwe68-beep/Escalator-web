<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#172638">
<title>ESCALATOR — New Veyron</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9fc3d5;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.pill{background:#172638eF;color:white;border:1px solid #61798c;border-radius:15px;padding:12px 15px;font-size:13px;letter-spacing:.3px}
#hint{position:absolute;bottom:165px;left:12px;right:12px;text-align:center;color:white;text-shadow:0 1px 4px #111;font-size:13px;pointer-events:none}
#controls{position:absolute;bottom:20px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-end}
#pad{display:grid;grid-template-columns:repeat(3,68px);grid-template-rows:repeat(2,68px);gap:7px}
button{background:#172638eF;color:white;border:1px solid #6c8496;border-radius:15px;font-size:16px;font-weight:bold;min-width:68px;min-height:62px;touch-action:none}
#up{grid-column:2;grid-row:1}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
#actions{display:flex;flex-direction:column;gap:9px}#actions button{width:132px;font-size:13px}
@media(min-width:800px){#controls{left:28px;right:28px}#pad{grid-template-columns:repeat(3,78px);grid-template-rows:repeat(2,78px)}button{min-width:78px;min-height:70px}}
</style>
</head>
<body>
<div id="top"><div class="pill"><b>ESCALATOR</b> · NEW VEYRON</div><div class="pill">CHARACTER UPGRADE</div></div>
<div id="hint">Move with the arrows or WASD · Drag to look around · Approach a named building and press ENTER</div>
<div id="controls">
  <div id="pad">
    <button id="up">▲</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button>
  </div>
  <div id="actions"><button id="run">HOLD TO RUN</button><button id="enter">ENTER / EXIT</button><button id="reset">RESET</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x9fc3d5); scene.fog=new THREE.Fog(0x9fc3d5,65,180);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe8f5ff,0x66704c,2));
const sun=new THREE.DirectionalLight(0xffedcf,2.1); sun.position.set(-35,55,25); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024); scene.add(sun);
const mat=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const ground= new THREE.Mesh(new THREE.PlaneGeometry(220,220),mat(0x55784d)); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
function cube(x,y,z,sx,sy,sz,color){let m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat(color));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
function road(x,z,w,d){let m=new THREE.Mesh(new THREE.BoxGeometry(w,.12,d),mat(0x34393d));m.position.set(x,.06,z);scene.add(m)}
road(0,0,180,18);road(0,0,18,180);
for(let i=-80;i<=80;i+=10){cube(i,.14,-10,.18,.02,.18,0xe8dfb7);cube(i,.14,10,.18,.02,.18,0xe8dfb7)}
function building(x,z,w,d,h,color,name){
 cube(x,h/2,z,w,h,d,color);
 for(let y=2.2;y<h-1;y+=2.7) for(let xx=x-w/2+1.5;xx<x+w/2-1;xx+=3){
  let win=new THREE.Mesh(new THREE.BoxGeometry(1.25,1.45,.08),mat(0x79a8b4,.35));win.position.set(xx,y,z-d/2-.05);scene.add(win);
 }
 cube(x,1.1,z-d/2-.12,1.8,2.2,.15,0x273746);
 const label=document.createElement('div'); label.textContent=name; label.style.cssText='position:absolute;color:white;background:#172638d9;padding:4px 7px;border-radius:6px;font:12px Arial;display:none'; document.body.appendChild(label);
 return {x,z,w,d,h,label,name};
}
const buildings=[
 building(-25,-27,24,16,15,0xc7b18a,'NEW VEYRON HOSPITAL'),
 building(22,-27,22,16,13,0xb8c2c4,'CENTRAL SHOPPING STORE'),
 building(-28,28,24,18,12,0xd2bca0,'ROSELAND MANSION'),
 building(25,28,22,18,25,0x788c9a,'MAZWI HOLDINGS'),
 building(0,-55,22,15,12,0xb4b8aa,'APARTMENT RESIDENCE')
];
// sidewalk strips
for(let z of [-11,11]){let s=cube(0,.16,z,180,.2,2,0xbab9ad)}
for(let x of [-11,11]){let s=cube(x,.16,0,2,.2,180,0xbab9ad)}
// Human-like low-poly character with torso, neck, head, hair, arms and legs
function makePerson(opts={}){
 const g=new THREE.Group(), skin=mat(opts.skin||0x9a6246), shirt=mat(opts.shirt||0x286b9b), pants=mat(opts.pants||0x263747), shoes=mat(0x20252a), hair=mat(opts.hair||0x211b19);
 const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.62,4,8),shirt);torso.position.y=1.22;torso.castShadow=true;g.add(torso);
 const neck=new THREE.Mesh(new THREE.CylinderGeometry(.105,.12,.18,8),skin);neck.position.y=1.72;g.add(neck);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.24,12,10),skin);head.position.y=2.02;head.castShadow=true;g.add(head);
 const cap=new THREE.Mesh(new THREE.SphereGeometry(.245,12,6,0,Math.PI*2,0,Math.PI/2),hair);cap.position.y=2.09;cap.scale.set(1, .55,1);g.add(cap);
 const armPivots=[],legPivots=[];
 for(let side of [-1,1]){
  let arm=new THREE.Group();arm.position.set(side*.4,1.48,0);g.add(arm);let upper=new THREE.Mesh(new THREE.CapsuleGeometry(.105,.43,3,7),shirt);upper.position.y=-.27;arm.add(upper);let hand=new THREE.Mesh(new THREE.SphereGeometry(.095,8,7),skin);hand.position.y=-.56;arm.add(hand);armPivots.push(arm);
  let leg=new THREE.Group();leg.position.set(side*.18,.82,0);g.add(leg);let thigh=new THREE.Mesh(new THREE.CapsuleGeometry(.14,.48,3,7),pants);thigh.position.y=-.28;leg.add(thigh);let shoe=new THREE.Mesh(new THREE.BoxGeometry(.22,.12,.38),shoes);shoe.position.set(0,-.58,.08);leg.add(shoe);legPivots.push(leg);
 }
 g.userData={armPivots,legPivots,phase:Math.random()*6.28};return g;
}
const player=makePerson({skin:0x9b674c,shirt:0x2475a5,pants:0x24384b});player.position.set(0,0,3);scene.add(player);
const npcs=[];const outfits=[[0x70452f,0x9b543e,0x25394a],[0xd0a47a,0x547d69,0x34343c],[0x754a35,0x9b9da7,0x303f52],[0x9b6b4c,0xb28a48,0x263a48],[0x613f30,0x8b617b,0x283746]];
for(let i=0;i<14;i++){let o=outfits[i%outfits.length];let p=makePerson({skin:o[0],shirt:o[1],pants:o[2]});p.position.set((Math.random()-.5)*76,0,(Math.random()-.5)*76);p.userData.path=[new THREE.Vector3(p.position.x,0,p.position.z),new THREE.Vector3(p.position.x+(Math.random()-.5)*12,0,p.position.z+(Math.random()-.5)*12)];p.userData.target=1;scene.add(p);npcs.push(p)}
// parked and moving traffic
const cars=[];for(let i=0;i<8;i++){let car=new THREE.Group();let body=new THREE.Mesh(new THREE.BoxGeometry(2.1,.7,4),mat([0x245b88,0x9a3d32,0xc4c7c8,0x26323a][i%4]));body.position.y=.65;car.add(body);let cabin=new THREE.Mesh(new THREE.BoxGeometry(1.6,.65,1.9),mat(0x8ba8b5));cabin.position.set(0,1.25,-.25);car.add(cabin);car.position.set(-75+i*20,.0,-7);scene.add(car);cars.push(car)}
let keys={},move={x:0,z:0},running=false,yaw=0,pitch=.18,drag=false,lastX=0,lastY=0;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Enter')enterBuilding()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function bind(id,key){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[key]=false))}
bind('up','w');bind('down','s');bind('left','a');bind('right','d');
const runBtn=document.getElementById('run');runBtn.addEventListener('pointerdown',e=>{e.preventDefault();running=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>runBtn.addEventListener(ev,()=>running=false));
document.getElementById('reset').onclick=()=>{player.position.set(0,0,3);yaw=0;pitch=.18};
let inside=false;function enterBuilding(){let b=buildings.find(b=>Math.abs(player.position.x-b.x)<b.w/2+3&&Math.abs(player.position.z-b.z)<b.d/2+3);if(!b)return;inside=!inside;if(inside){alert('Entering '+b.name+' — interior rooms are planned for a future upgrade.');inside=false}}
document.getElementById('enter').onclick=enterBuilding;
renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientY<innerHeight-180){drag=true;lastX=e.clientX;lastY=e.clientY}});
addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(drag){yaw-=(e.clientX-lastX)*.005;pitch=Math.max(-.15,Math.min(.65,pitch+(e.clientY-lastY)*.003));lastX=e.clientX;lastY=e.clientY}});
function animate(t){requestAnimationFrame(animate);let dt=Math.min(.04,clock.getDelta()),speed=running?8:4.5;
 let f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),s=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
 let dir=new THREE.Vector3(s,0,-f);if(dir.length()>0){dir.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw);player.position.addScaledVector(dir,speed*dt);player.rotation.y=Math.atan2(dir.x,dir.z)}
 animateLimbs(player,t/250,Math.min(1,Math.hypot(f,s)));
 npcs.forEach((p,i)=>{let path=p.userData.path,target=path[p.userData.target];let v=target.clone().sub(p.position);if(v.length()<.5)p.userData.target=1-p.userData.target;else{v.normalize();p.position.addScaledVector(v,dt*.65);p.rotation.y=Math.atan2(v.x,v.z)}animateLimbs(p,t/350,.55)});
 cars.forEach(c=>{c.position.x+=dt*3.5;if(c.position.x>80)c.position.x=-80});
 let target=new THREE.Vector3(player.position.x,1.5,player.position.z);let offset=new THREE.Vector3(Math.sin(yaw)*10,4+pitch*7,Math.cos(yaw)*10);camera.position.copy(target).add(offset);camera.lookAt(target);
 renderer.render(scene,camera)}
function animateLimbs(p,time,amount){let u=p.userData;u.armPivots.forEach((a,i)=>a.rotation.x=Math.sin(time+u.phase+i*Math.PI)*.55*amount);u.legPivots.forEach((l,i)=>l.rotation.x=Math.sin(time+u.phase+i*Math.PI)*.65*amount)}
const clock=new THREE.Clock();camera.position.set(0,5,13);animate(0);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script>
</body></html>
